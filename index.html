<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Umar Jahangir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --bg: #070b13;
            --bg-2: #0a0f1c;
            --panel: #0f1626;
            --panel-2: #131c30;
            --border: rgba(148, 163, 184, 0.14);
            --border-soft: rgba(148, 163, 184, 0.08);
            --text: #e8edf6;
            --text-dim: #93a0b8;
            --text-faint: #5b6780;
            --accent: #3fe9c4;
            --accent-dim: rgba(63, 233, 196, 0.14);
            --accent-2: #8d7bf7;
            --accent-2-dim: rgba(141, 123, 247, 0.14);
            --danger: #ef7272;
            --mono: 'JetBrains Mono', monospace;
            --display: 'Space Grotesk', sans-serif;
            --sans: 'Inter', sans-serif;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        #root-scope {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            position: relative;
            line-height: 1.55;
        }

        #root-scope ::selection {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .hidden {
            display: none !important;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        input,
        textarea,
        select {
            font-family: inherit;
        }

        /* ---------- background circuit fx ---------- */
        #bg-fx {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 900px 500px at 82% -8%, rgba(63, 233, 196, 0.10), transparent 60%),
                radial-gradient(ellipse 700px 500px at 5% 15%, rgba(141, 123, 247, 0.08), transparent 60%);
        }

        #bg-fx svg {
            position: absolute;
            top: 0;
            right: 0;
            opacity: 0.5;
        }

        /* ---------- nav ---------- */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 40;
            backdrop-filter: blur(10px);
            background: rgba(7, 11, 19, 0.72);
            border-bottom: 1px solid var(--border-soft);
        }

        .nav-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            transition: all .2s ease;
            flex-shrink: 0;
        }

        .logo-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .nav-links {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-links a {
            font-size: 13.5px;
            color: var(--text-dim);
            padding: 8px 12px;
            border-radius: 8px;
            transition: all .15s ease;
            font-weight: 500;
            letter-spacing: .2px;
        }

        .nav-links a:hover {
            color: var(--text);
            background: var(--panel);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 38px;
            height: 38px;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        @media (max-width:860px) {
            .nav-links {
                position: fixed;
                top: 66px;
                left: 0;
                right: 0;
                flex-direction: column;
                align-items: stretch;
                background: var(--bg-2);
                border-bottom: 1px solid var(--border);
                padding: 10px;
                gap: 2px;
                transform: translateY(-8px);
                opacity: 0;
                pointer-events: none;
                transition: all .18s ease;
            }

            .nav-links.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }

            .nav-links a {
                padding: 12px 14px;
            }

            .menu-toggle {
                display: flex;
            }
        }

        /* ---------- shared section layout ---------- */
        .section {
            position: relative;
            z-index: 1;
            max-width: 1180px;
            margin: 0 auto;
            padding: 96px 24px;
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent);
            letter-spacing: .14em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .eyebrow::before {
            content: '';
            width: 22px;
            height: 1px;
            background: var(--accent);
            display: inline-block;
        }

        .section-title {
            font-family: var(--display);
            font-weight: 600;
            font-size: clamp(28px, 3.6vw, 40px);
            letter-spacing: -0.01em;
            margin: 0 0 40px 0;
        }

        .section-title span {
            color: var(--accent);
        }

        /* ---------- hero ---------- */
        .hero {
            padding-top: 72px;
            padding-bottom: 80px;
            min-height: 88vh;
            display: flex;
            align-items: center;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 56px;
            align-items: center;
            width: 100%;
        }

        @media (max-width:900px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
        }

        .hero-eyebrow {
            font-family: var(--mono);
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero-eyebrow .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-dim);
        }

        .hero h1 {
            font-family: var(--display);
            font-weight: 700;
            font-size: clamp(38px, 6vw, 64px);
            line-height: 1.03;
            margin: 0 0 18px 0;
            letter-spacing: -0.02em;
        }

        .hero h1 .accent {
            color: var(--accent);
        }

        .role-line {
            font-family: var(--mono);
            font-size: clamp(16px, 2vw, 20px);
            color: var(--text-dim);
            margin-bottom: 22px;
            min-height: 28px;
        }

        .role-line .type-accent {
            color: var(--accent-2);
            font-weight: 600;
        }

        .role-line .caret {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: -2px;
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .hero-desc {
            color: var(--text-dim);
            font-size: 16px;
            max-width: 560px;
            margin-bottom: 30px;
        }

        .hero-stats {
            display: flex;
            gap: 26px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .stat b {
            display: block;
            font-family: var(--display);
            font-size: 26px;
            color: var(--text);
        }

        .stat span {
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid transparent;
            transition: all .18s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #04140f;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(63, 233, 196, 0.22);
        }

        .btn-ghost {
            border-color: var(--border);
            color: var(--text);
            background: var(--panel);
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .social-row {
            display: flex;
            gap: 10px;
            margin-top: 26px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            transition: all .18s ease;
        }

        .icon-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .hero-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .hero-panel-bar {
            display: flex;
            gap: 6px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-soft);
        }

        .hero-panel-bar span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a3446;
        }

        .hero-panel-body {
            padding: 22px;
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text-dim);
        }

        .hero-panel-body .l1 {
            color: var(--accent-2);
        }

        .hero-panel-body .l2 {
            color: var(--accent);
        }

        .hero-panel-body pre {
            margin: 0;
            white-space: pre-wrap;
        }

        /* ---------- education ---------- */
        .edu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width:900px) {
            .edu-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px;
            transition: all .2s ease;
            position: relative;
        }

        .card:hover {
            border-color: rgba(63, 233, 196, 0.35);
            transform: translateY(-3px);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--accent-dim);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .card h3 {
            font-family: var(--display);
            font-size: 17px;
            margin: 0 0 6px 0;
            font-weight: 600;
        }

        .card .sub {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card .meta {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--accent-2);
            margin-bottom: 10px;
        }

        .card .desc {
            color: var(--text-dim);
            font-size: 13.5px;
        }

        .empty-note {
            color: var(--text-faint);
            font-family: var(--mono);
            font-size: 13px;
            padding: 20px 0;
        }

        /* ---------- experience timeline ---------- */
        .timeline {
            position: relative;
            padding-left: 28px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 6px;
            bottom: 6px;
            width: 1.5px;
            background: var(--border);
        }

        .tl-item {
            position: relative;
            padding-bottom: 34px;
        }

        .tl-item:last-child {
            padding-bottom: 0;
        }

        .tl-item::before {
            content: '';
            position: absolute;
            left: -28px;
            top: 4px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--bg);
            border: 2px solid var(--accent);
            box-shadow: 0 0 0 4px var(--accent-dim);
        }

        .tl-item h3 {
            font-family: var(--display);
            font-size: 17px;
            margin: 0 0 4px 0;
        }

        .tl-item .company {
            color: var(--accent-2);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .tl-item .meta {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-faint);
        }

        /* ---------- skills ---------- */
        .skill-search-wrap {
            position: relative;
            max-width: 420px;
            margin-bottom: 34px;
        }

        .skill-search-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-faint);
        }

        .skill-search-input {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px 12px 40px;
            color: var(--text);
            font-size: 14px;
            font-family: var(--mono);
            outline: none;
        }

        .skill-search-input:focus {
            border-color: var(--accent);
        }

        .skill-no-results {
            font-family: var(--mono);
            color: var(--text-faint);
            font-size: 13px;
        }

        /* skill category cards, grid layout */
        .skill-card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        @media (max-width:980px) {
            .skill-card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:640px) {
            .skill-card-grid {
                grid-template-columns: 1fr;
            }
        }

        .skill-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            transition: all .2s ease;
        }

        .skill-card:hover {
            border-color: var(--skill-color, var(--accent));
            transform: translateY(-3px);
        }

        .skill-card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 16px 0;
            font-family: var(--mono);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--text-dim);
        }

        .skill-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--skill-color, var(--accent));
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--skill-color, var(--accent)) 18%, transparent);
            flex-shrink: 0;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 13px;
            padding: 6px 14px 6px 8px;
            border-radius: 8px;
            background: color-mix(in srgb, var(--skill-color, var(--accent)) 10%, var(--panel-2));
            border: 1px solid color-mix(in srgb, var(--skill-color, var(--accent)) 40%, var(--border));
            color: var(--skill-color, var(--text-dim));
            transition: all .15s ease;
        }

        .skill-tag:hover {
            border-color: var(--skill-color, var(--accent));
            background: color-mix(in srgb, var(--skill-color, var(--accent)) 20%, var(--panel-2));
            transform: translateY(-1px);
        }

        .skill-icon-badge {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 3px;
            box-sizing: border-box;
        }

        .skill-icon-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ---------- certifications / patents / research (horizontal scroll) ---------- */
        .cert-scroller-wrap {
            position: relative;
        }

        .cert-scroller {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 6px 4px 18px 4px;
            scrollbar-width: thin;
        }

        .cert-scroller::-webkit-scrollbar {
            height: 6px;
        }

        .cert-scroller::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 6px;
        }

        .cert-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all .2s ease;
        }

        .cert-card:hover {
            border-color: rgba(141, 123, 247, 0.4);
            transform: translateY(-3px);
        }

        .cert-card .cert-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .cert-card .badge {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--accent-2-dim);
            color: var(--accent-2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cert-card h3 {
            font-family: var(--display);
            font-size: 15.5px;
            margin: 0;
        }

        .cert-card .issuer {
            color: var(--text-dim);
            font-size: 13px;
        }

        .cert-card a.view-link {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: auto;
        }

        .scroll-arrows {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .scroll-arrow {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scroll-arrow:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* ---------- patents ---------- */
        .patents-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        @media (max-width:800px) {
            .patents-grid {
                grid-template-columns: 1fr;
            }
        }

        .patent-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all .2s ease;
        }

        .patent-card:hover {
            border-color: rgba(63, 233, 196, 0.4);
            transform: translateY(-3px);
        }

        .patent-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: #e0a458;
        }

        .patent-card.is-published .patent-status {
            color: var(--accent);
        }

        .patent-title {
            font-family: var(--display);
            font-size: 17px;
            line-height: 1.4;
            margin: 0;
        }

        .patent-meta {
            color: var(--text-dim);
            font-size: 13px;
        }

        .patent-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .patent-tag {
            font-family: var(--mono);
            font-size: 12px;
            padding: 5px 11px;
            border-radius: 7px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .patent-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: auto;
            padding-top: 4px;
        }

        .patent-links a {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ---------- achievements ---------- */
        .achv-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        @media (max-width:980px) {
            .achv-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:640px) {
            .achv-grid {
                grid-template-columns: 1fr;
            }
        }

        .achv-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all .2s ease;
        }

        .achv-card:hover {
            border-color: rgba(224, 164, 88, 0.4);
            transform: translateY(-3px);
        }

        .achv-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(224, 164, 88, 0.14);
            color: #e0a458;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .achv-title {
            font-family: var(--display);
            font-size: 17px;
            margin: 0;
        }

        .achv-subtitle {
            font-family: var(--sans);
            font-weight: 600;
            font-size: 13.5px;
            color: #e0a458;
        }

        .achv-meta {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-faint);
            margin-bottom: 6px;
        }

        .achv-desc {
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.55;
        }

        .achv-link {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        /* ---------- projects ---------- */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        @media (max-width:980px) {
            .cert-grid {
                grid-template-columns: repeat(2, 1fr);
            }

                    '<div class="contact-grid">' +
                    '<div>' +
                    (c.email ? '<div class="contact-info-item"><div class="ic">' + ICONS.mail + '</div><div><div class="lbl">Email</div><div class="val">' + escapeHtml(c.email) + '</div></div></div>' : '') +
                    (c.phone ? '<div class="contact-info-item"><div class="ic">' + ICONS.phone + '</div><div><div class="lbl">Phone</div><div class="val">' + escapeHtml(c.phone) + '</div></div></div>' : '') +
                    (c.location ? '<div class="contact-info-item"><div class="ic">' + ICONS.pin + '</div><div><div class="lbl">Location</div><div class="val">' + escapeHtml(c.location) + '</div></div></div>' : '') +
                    '<div class="social-row">' +
                    (c.github ? '<a class="icon-btn" href="' + escapeHtml(c.github) + '" target="_blank" rel="noopener">' + ICONS.github + '</a>' : '') +
                    (c.linkedin ? '<a class="icon-btn" href="' + escapeHtml(c.linkedin) + '" target="_blank" rel="noopener">' + ICONS.linkedin + '</a>' : '') +
                    '</div>' +
                    '</div>' +
                    '<form id="contact-form">' +
                    '<div class="form-field"><label>Name</label><input type="text" id="cf-name" /></div>' +
                    '<div class="form-field"><label>Email</label><input type="email" id="cf-email" /></div>' +
                    '<div class="form-field"><label>Message</label><textarea id="cf-message"></textarea></div>' +
                    '<button type="submit" class="btn btn-primary">Send message</button>' +
                    '</form>' +
                    '</div>' +
                    '</section>';
            }

            function bindEvents() {
                var form = document.getElementById('contact-form');
                if (form) {
                    form.addEventListener('submit', async function (e) {
                        e.preventDefault();
                        var submitBtn = form.querySelector('button[type="submit"]');
                        var name = document.getElementById('cf-name').value.trim();
                        var email = document.getElementById('cf-email').value.trim();
                        var msg = document.getElementById('cf-message').value.trim();
                        if (!name && !email && !msg) return;

                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Sending…';

                        var body = (msg || '(no message)') + (email ? ('\n\nFrom: ' + name + ' <' + email + '>') : (name ? ('\n\nFrom: ' + name) : ''));

                        try {
                            await fetch('https://ntfy.sh/' + NTFY_TOPIC, {
                                method: 'POST',
                                body: body,
                                headers: {
                                    'Title': 'New portfolio message from ' + (name || 'a visitor'),
                                    'Tags': 'email'
                                }
                            });
                            form.reset();
                            showToast('Message sent — thanks for reaching out!');
                        } catch (err) {
                            console.error(err);
                            showToast('Could not send — please try again, or email me directly.');
                        }

                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Send message';
                    });
                }

                document.querySelectorAll('#nav-links a').forEach(function (a) {
                    a.addEventListener('click', function () { document.getElementById('nav-links').classList.remove('open'); });
                });

                bindSkillSearch();
                typeRoles();
            }

            function bindSkillSearch() {
                var input = document.getElementById('skill-search-input');
                if (!input) return;
                input.addEventListener('input', function () {
                    var q = input.value.trim().toLowerCase();
                    var wrap = document.getElementById('skill-groups-wrap');
                    var groups = wrap.querySelectorAll('.skill-card');
                    var anyVisible = false;
                    groups.forEach(function (g) {
                        var tags = g.querySelectorAll('.skill-tag');
                        var groupHasMatch = false;
                        tags.forEach(function (t) {
                            var match = !q || t.textContent.toLowerCase().indexOf(q) !== -1;
                            t.style.display = match ? '' : 'none';
                            if (match) groupHasMatch = true;
                        });
                        g.style.display = groupHasMatch ? '' : 'none';
                        if (groupHasMatch) anyVisible = true;
                    });
                    var noResultsEl = document.getElementById('skill-no-results');
                    if (!anyVisible && q) {
                        if (!noResultsEl) {
                            noResultsEl = document.createElement('div');
                            noResultsEl.id = 'skill-no-results';
                            noResultsEl.className = 'skill-no-results';
                            noResultsEl.textContent = "No matching skill — but feel free to ask, I might still be learning it.";
                            wrap.appendChild(noResultsEl);
                        }
                    } else if (noResultsEl) {
                        noResultsEl.remove();
                    }
                });
            }

            function typeRoles() {
                var roles = ["Full-Stack Developer", "Cybersecurity Enthusiast", "Blockchain Builder", "IoT Tinkerer"];
                var el = document.getElementById('typed-role');
                if (!el) return;
                var ri = 0, ci = 0, deleting = false;
                function tick() {
                    el = document.getElementById('typed-role');
                    if (!el) return;
                    var word = roles[ri];
                    if (!deleting) {
                        ci++;
                        el.textContent = word.slice(0, ci);
                        if (ci === word.length) { deleting = true; setTimeout(tick, 1400); return; }
                    } else {
                        ci--;
                        el.textContent = word.slice(0, ci);
                        if (ci === 0) { deleting = false; ri = (ri + 1) % roles.length; }
                    }
                    setTimeout(tick, deleting ? 40 : 75);
                }
                setTimeout(tick, 900);
            }

            document.getElementById('logo-btn').innerHTML = ICONS.home;
            document.getElementById('menu-toggle').innerHTML = ICONS.menu;
            document.getElementById('menu-toggle').addEventListener('click', function () {
                document.getElementById('nav-links').classList.toggle('open');
            });

            renderAll();
        })();
    </script>
</body>

</html>
