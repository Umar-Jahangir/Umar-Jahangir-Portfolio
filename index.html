<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Umar Jahangir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --bg: #070b13;
            --bg-2: #0a0f1c;
            --panel: #0f1626;
            --panel-2: #131c30;
            --border: rgba(148, 163, 184, 0.14);
            --border-soft: rgba(148, 163, 184, 0.08);
            --text: #e8edf6;
            --text-dim: #93a0b8;
            --text-faint: #5b6780;
            --accent: #3fe9c4;
            --accent-dim: rgba(63, 233, 196, 0.14);
            --accent-2: #8d7bf7;
            --accent-2-dim: rgba(141, 123, 247, 0.14);
            --danger: #ef7272;
            --mono: 'JetBrains Mono', monospace;
            --display: 'Space Grotesk', sans-serif;
            --sans: 'Inter', sans-serif;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        #root-scope {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            line-height: 1.55;
        }

        #root-scope ::selection {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .hidden {
            display: none !important;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        input,
        textarea,
        select {
            font-family: inherit;
        }

        /* ---------- background circuit fx ---------- */
        #bg-fx {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 900px 500px at 82% -8%, rgba(63, 233, 196, 0.10), transparent 60%),
                radial-gradient(ellipse 700px 500px at 5% 15%, rgba(141, 123, 247, 0.08), transparent 60%);
        }

        #bg-fx svg {
            position: absolute;
            top: 0;
            right: 0;
            opacity: 0.5;
        }

        /* ---------- nav ---------- */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 40;
            backdrop-filter: blur(10px);
            background: rgba(7, 11, 19, 0.72);
            border-bottom: 1px solid var(--border-soft);
        }

        .nav-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            transition: all .2s ease;
            flex-shrink: 0;
        }

        .logo-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .nav-links {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-links a {
            font-size: 13.5px;
            color: var(--text-dim);
            padding: 8px 12px;
            border-radius: 8px;
            transition: all .15s ease;
            font-weight: 500;
            letter-spacing: .2px;
        }

        .nav-links a:hover {
            color: var(--text);
            background: var(--panel);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 38px;
            height: 38px;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        @media (max-width:860px) {
            .nav-links {
                position: fixed;
                top: 66px;
                left: 0;
                right: 0;
                flex-direction: column;
                align-items: stretch;
                background: var(--bg-2);
                border-bottom: 1px solid var(--border);
                padding: 10px;
                gap: 2px;
                transform: translateY(-8px);
                opacity: 0;
                pointer-events: none;
                transition: all .18s ease;
            }

            .nav-links.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }

            .nav-links a {
                padding: 12px 14px;
            }

            .menu-toggle {
                display: flex;
            }
        }

        /* ---------- shared section layout ---------- */
        .section {
            position: relative;
            z-index: 1;
            max-width: 1180px;
            margin: 0 auto;
            padding: 96px 24px;
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent);
            letter-spacing: .14em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .eyebrow::before {
            content: '';
            width: 22px;
            height: 1px;
            background: var(--accent);
            display: inline-block;
        }

        .section-title {
            font-family: var(--display);
            font-weight: 600;
            font-size: clamp(28px, 3.6vw, 40px);
            letter-spacing: -0.01em;
            margin: 0 0 40px 0;
        }

        .section-title span {
            color: var(--accent);
        }

        /* ---------- hero ---------- */
        .hero {
            padding-top: 72px;
            padding-bottom: 80px;
            min-height: 88vh;
            display: flex;
            align-items: center;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 56px;
            align-items: center;
            width: 100%;
        }

        @media (max-width:900px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
        }

        .hero-eyebrow {
            font-family: var(--mono);
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero-eyebrow .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-dim);
        }

        .hero h1 {
            font-family: var(--display);
            font-weight: 700;
            font-size: clamp(38px, 6vw, 64px);
            line-height: 1.03;
            margin: 0 0 18px 0;
            letter-spacing: -0.02em;
        }

        .hero h1 .accent {
            color: var(--accent);
        }

        .role-line {
            font-family: var(--mono);
            font-size: clamp(16px, 2vw, 20px);
            color: var(--text-dim);
            margin-bottom: 22px;
            min-height: 28px;
        }

        .role-line .type-accent {
            color: var(--accent-2);
            font-weight: 600;
        }

        .role-line .caret {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: -2px;
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .hero-desc {
            color: var(--text-dim);
            font-size: 16px;
            max-width: 560px;
            margin-bottom: 30px;
        }

        .hero-stats {
            display: flex;
            gap: 26px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .stat b {
            display: block;
            font-family: var(--display);
            font-size: 26px;
            color: var(--text);
        }

        .stat span {
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid transparent;
            transition: all .18s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #04140f;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(63, 233, 196, 0.22);
        }

        .btn-ghost {
            border-color: var(--border);
            color: var(--text);
            background: var(--panel);
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .social-row {
            display: flex;
            gap: 10px;
            margin-top: 26px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            transition: all .18s ease;
        }

        .icon-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .hero-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .hero-panel-bar {
            display: flex;
            gap: 6px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-soft);
        }

        .hero-panel-bar span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a3446;
        }

        .hero-panel-body {
            padding: 22px;
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text-dim);
        }

        .hero-panel-body .l1 {
            color: var(--accent-2);
        }

        .hero-panel-body .l2 {
            color: var(--accent);
        }

        .hero-panel-body pre {
            margin: 0;
            white-space: pre-wrap;
        }

        /* ---------- education ---------- */
        .edu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width:900px) {
            .edu-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px;
            transition: all .2s ease;
            position: relative;
        }

        .card:hover {
            border-color: rgba(63, 233, 196, 0.35);
            transform: translateY(-3px);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--accent-dim);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .card h3 {
            font-family: var(--display);
            font-size: 17px;
            margin: 0 0 6px 0;
            font-weight: 600;
        }

        .card .sub {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card .meta {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--accent-2);
            margin-bottom: 10px;
        }

        .card .desc {
            color: var(--text-dim);
            font-size: 13.5px;
        }

        .empty-note {
            color: var(--text-faint);
            font-family: var(--mono);
            font-size: 13px;
            padding: 20px 0;
        }

        /* ---------- experience timeline ---------- */
        .timeline {
            position: relative;
            padding-left: 28px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 6px;
            bottom: 6px;
            width: 1.5px;
            background: var(--border);
        }

        .tl-item {
            position: relative;
            padding-bottom: 34px;
        }

        .tl-item:last-child {
            padding-bottom: 0;
        }

        .tl-item::before {
            content: '';
            position: absolute;
            left: -28px;
            top: 4px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--bg);
            border: 2px solid var(--accent);
            box-shadow: 0 0 0 4px var(--accent-dim);
        }

        .tl-item h3 {
            font-family: var(--display);
            font-size: 17px;
            margin: 0 0 4px 0;
        }

        .tl-item .company {
            color: var(--accent-2);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .tl-item .meta {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-faint);
        }

        /* ---------- skills ---------- */
        .skill-search-wrap {
            position: relative;
            max-width: 420px;
            margin-bottom: 34px;
        }

        .skill-search-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-faint);
        }

        .skill-search-input {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px 12px 40px;
            color: var(--text);
            font-size: 14px;
            font-family: var(--mono);
            outline: none;
        }

        .skill-search-input:focus {
            border-color: var(--accent);
        }

        .skill-no-results {
            font-family: var(--mono);
            color: var(--text-faint);
            font-size: 13px;
        }

        .skill-group {
            margin-bottom: 26px;
        }

        .skill-group h4 {
            font-family: var(--mono);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--text-faint);
            margin: 0 0 12px 0;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            font-family: var(--mono);
            font-size: 13px;
            padding: 7px 14px;
            border-radius: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text-dim);
            transition: all .15s ease;
        }

        .tag:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        /* ---------- certifications / patents / research (horizontal scroll) ---------- */
        .cert-scroller-wrap {
            position: relative;
        }

        .cert-scroller {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 6px 4px 18px 4px;
            scrollbar-width: thin;
        }

        .cert-scroller::-webkit-scrollbar {
            height: 6px;
        }

        .cert-scroller::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 6px;
        }

        .cert-card {
            flex: 0 0 280px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all .2s ease;
        }

        .cert-card:hover {
            border-color: rgba(141, 123, 247, 0.4);
            transform: translateY(-3px);
        }

        .cert-card .cert-img {
            height: 120px;
            background: linear-gradient(135deg, rgba(63, 233, 196, 0.14), rgba(141, 123, 247, 0.14));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-faint);
            background-size: cover;
            background-position: center;
        }

        .cert-card .cert-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .cert-card .badge {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--accent-2-dim);
            color: var(--accent-2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cert-card h3 {
            font-family: var(--display);
            font-size: 15.5px;
            margin: 0;
        }

        .cert-card .issuer {
            color: var(--text-dim);
            font-size: 13px;
        }

        .cert-card a.view-link {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: auto;
        }

        .scroll-arrows {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .scroll-arrow {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scroll-arrow:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* ---------- projects ---------- */
        .proj-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        @media (max-width:980px) {
            .proj-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:640px) {
            .proj-grid {
                grid-template-columns: 1fr;
            }
        }

        .proj-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all .2s ease;
        }

        .proj-card:hover {
            border-color: rgba(141, 123, 247, 0.4);
            transform: translateY(-3px);
        }

        .proj-img {
            height: 140px;
            background: linear-gradient(135deg, rgba(63, 233, 196, 0.14), rgba(141, 123, 247, 0.14));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-faint);
            background-size: cover;
            background-position: center;
        }

        .proj-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .proj-body h3 {
            font-family: var(--display);
            font-size: 16px;
            margin: 0;
        }

        .proj-body p {
            color: var(--text-dim);
            font-size: 13.5px;
            margin: 0;
            flex: 1;
        }

        .proj-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .proj-actions a {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--accent-2);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ---------- contact ---------- */
        .contact-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 40px;
        }

        @media (max-width:860px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }

        .contact-info-item {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 22px;
        }

        .contact-info-item .ic {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }

        .contact-info-item .lbl {
            font-family: var(--mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-faint);
            margin-bottom: 3px;
        }

        .contact-info-item .val {
            font-size: 14.5px;
            color: var(--text);
        }

        .form-field {
            margin-bottom: 16px;
        }

        .form-field label {
            display: block;
            font-family: var(--mono);
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--text-faint);
            margin-bottom: 7px;
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 11px 13px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .15s ease;
        }

        .form-field input:focus,
        .form-field textarea:focus {
            border-color: var(--accent);
        }

        .form-field textarea {
            resize: vertical;
            min-height: 110px;
        }

        footer {
            position: relative;
            z-index: 1;
            border-top: 1px solid var(--border-soft);
            padding: 26px 24px;
            text-align: center;
        }

        footer p {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-faint);
            margin: 0;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-2);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 11px 20px;
            border-radius: 10px;
            font-size: 13.5px;
            z-index: 200;
            font-family: var(--mono);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>

    <div id="root-scope">
        <div id="bg-fx">
            <svg width="560" height="560" viewBox="0 0 560 560" fill="none">
                <g stroke="#3fe9c4" stroke-opacity="0.35">
                    <line x1="60" y1="80" x2="220" y2="150" />
                    <line x1="220" y1="150" x2="380" y2="90" />
                    <line x1="220" y1="150" x2="260" y2="300" />
                    <line x1="380" y1="90" x2="470" y2="200" />
                    <line x1="260" y1="300" x2="420" y2="340" />
                    <line x1="470" y1="200" x2="420" y2="340" />
                    <line x1="420" y1="340" x2="380" y2="470" />
                </g>
                <g fill="#3fe9c4">
                    <circle cx="60" cy="80" r="4" />
                    <circle cx="220" cy="150" r="5" />
                    <circle cx="380" cy="90" r="4" />
                    <circle cx="470" cy="200" r="4" />

            function escapeHtml(str) {
                if (str === undefined || str === null) return "";
                return String(str).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
            }

            function showToast(msg) {

                    '<button type="submit" class="btn btn-primary">Send message</button>' +
                    '</form>' +
                    '</div>' +
                    '</section>';
            }

            function bindEvents() {
                var scroller = document.getElementById('cert-scroller');
                var left = document.getElementById('cert-left');
                var right = document.getElementById('cert-right');
                if (left) left.addEventListener('click', function () { scroller.scrollBy({ left: -300, behavior: 'smooth' }); });
                if (right) right.addEventListener('click', function () { scroller.scrollBy({ left: 300, behavior: 'smooth' }); });

                var form = document.getElementById('contact-form');
                if (form) {
                    form.addEventListener('submit', async function (e) {
                        e.preventDefault();
                        var submitBtn = form.querySelector('button[type="submit"]');
                        var name = document.getElementById('cf-name').value.trim();
                        var email = document.getElementById('cf-email').value.trim();
                        var msg = document.getElementById('cf-message').value.trim();
                        if (!name && !email && !msg) return;

                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Sending…';

                        var body = (msg || '(no message)') + (email ? ('\n\nFrom: ' + name + ' <' + email + '>') : (name ? ('\n\nFrom: ' + name) : ''));

                        try {
                            await fetch('https://ntfy.sh/' + NTFY_TOPIC, {
                                method: 'POST',
                                body: body,
                                headers: {
                                    'Title': 'New portfolio message from ' + (name || 'a visitor'),
                                    'Tags': 'email'
                                }
                            });
                            form.reset();
                            showToast('Message sent — thanks for reaching out!');
                        } catch (err) {
                            console.error(err);
                            showToast('Could not send — please try again, or email me directly.');
                        }

                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Send message';
                    });
                }

                document.querySelectorAll('#nav-links a').forEach(function (a) {
                    a.addEventListener('click', function () { document.getElementById('nav-links').classList.remove('open'); });
                });

                bindSkillSearch();
                typeRoles();
            }

            function bindSkillSearch() {
                var input = document.getElementById('skill-search-input');
                if (!input) return;
                input.addEventListener('input', function () {
                    var q = input.value.trim().toLowerCase();
                    var wrap = document.getElementById('skill-groups-wrap');
                    var groups = wrap.querySelectorAll('.skill-group');
                    var anyVisible = false;
                    groups.forEach(function (g) {
                        var tags = g.querySelectorAll('.tag');
                        var groupHasMatch = false;
                        tags.forEach(function (t) {
                            var match = !q || t.textContent.toLowerCase().indexOf(q) !== -1;
                            t.style.display = match ? '' : 'none';
                            if (match) groupHasMatch = true;
                        });
                        g.style.display = groupHasMatch ? '' : 'none';
                        if (groupHasMatch) anyVisible = true;
                    });
                    var noResultsEl = document.getElementById('skill-no-results');
                    if (!anyVisible && q) {
                        if (!noResultsEl) {
                            noResultsEl = document.createElement('div');
                            noResultsEl.id = 'skill-no-results';
                            noResultsEl.className = 'skill-no-results';
                            noResultsEl.textContent = "No matching skill — but feel free to ask, I might still be learning it.";
                            wrap.appendChild(noResultsEl);
                        }
                    } else if (noResultsEl) {
                        noResultsEl.remove();
                    }
                });
            }

            function typeRoles() {
                var roles = ["Full-Stack Developer", "Cybersecurity Enthusiast", "Blockchain Builder", "IoT Tinkerer"];
                var el = document.getElementById('typed-role');
                if (!el) return;
                var ri = 0, ci = 0, deleting = false;
                function tick() {
                    el = document.getElementById('typed-role');
                    if (!el) return;
                    var word = roles[ri];
                    if (!deleting) {
                        ci++;
                        el.textContent = word.slice(0, ci);
                        if (ci === word.length) { deleting = true; setTimeout(tick, 1400); return; }
                    } else {
                        ci--;
                        el.textContent = word.slice(0, ci);
                        if (ci === 0) { deleting = false; ri = (ri + 1) % roles.length; }
                    }
                    setTimeout(tick, deleting ? 40 : 75);
                }
                setTimeout(tick, 900);
            }

            document.getElementById('logo-btn').innerHTML = ICONS.home;
            document.getElementById('menu-toggle').innerHTML = ICONS.menu;
            document.getElementById('menu-toggle').addEventListener('click', function () {
                document.getElementById('nav-links').classList.toggle('open');
            });

            renderAll();
        })();
